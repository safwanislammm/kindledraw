
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1,
                 maximum-scale=1, user-scalable=no">
  <title>KindleDraw</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: white;
      color: black;
      font-family: sans-serif;
    }

    #toolbar {
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      border-bottom: 1px solid black;
    }

    button {
      height: 36px;
      padding: 0 14px;
      border: 1px solid black;
      border-radius: 0;
      background: white;
      color: black;
      font-size: 15px;
    }

    #status {
      height: 26px;
      padding: 5px 10px;
      font-size: 12px;
      border-bottom: 1px solid #ddd;
    }

    #board {
      display: block;
      width: 100%;
      height: calc(100% - 74px);
      background: white;
      touch-action: none;
    }
  </style>
</head>
<body>
  <header id="toolbar">
    <strong>KindleDraw</strong>
    <button id="clear" type="button">Clear</button>
  </header>

  <div id="status">Ready to draw.</div>
  <canvas id="board"></canvas>

  <script>
    (() => {
      const canvas = document.getElementById("board");
      const ctx = canvas.getContext("2d", {
        alpha: false
      });
      const status = document.getElementById("status");

      let drawing = false;
      let pointerId = null;
      let last = null;
      let midpoint = null;
      let strokes = 0;

      function configure() {
        ctx.strokeStyle = "#000";
        ctx.fillStyle = "#fff";
        ctx.lineWidth = 2;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
      }

      function resize() {
        const rect = canvas.getBoundingClientRect();
        const scale = Math.min(
          window.devicePixelRatio || 1, 2
        );

        if (canvas.width === Math.round(rect.width * scale) &&
            canvas.height === Math.round(rect.height * scale)) {
          return;
        }

        const saved = document.createElement("canvas");
        saved.width = canvas.width;
        saved.height = canvas.height;

        if (saved.width && saved.height) {
          saved.getContext("2d").drawImage(canvas, 0, 0);
        }

        canvas.width = Math.max(1, Math.round(rect.width * scale));
        canvas.height = Math.max(1, Math.round(rect.height * scale));

        ctx.setTransform(scale, 0, 0, scale, 0, 0);
        configure();
        ctx.fillRect(0, 0, rect.width, rect.height);

        if (saved.width && saved.height) {
          ctx.save();
          ctx.setTransform(1, 0, 0, 1, 0, 0);
          ctx.drawImage(
            saved, 0, 0, saved.width, saved.height,
            0, 0, canvas.width, canvas.height
          );
          ctx.restore();
          ctx.setTransform(scale, 0, 0, scale, 0, 0);
          configure();
        }
      }

      function point(e) {
        const rect = canvas.getBoundingClientRect();
        return {
          x: e.clientX - rect.left,
          y: e.clientY - rect.top
        };
      }

      function middle(a, b) {
        return {
          x: (a.x + b.x) / 2,
          y: (a.y + b.y) / 2
        };
      }

      // Render every movement as soon as JavaScript receives it.
      function addPoint(p) {
        if (!last) {
          last = p;
          midpoint = p;

          ctx.beginPath();
          ctx.arc(p.x, p.y, ctx.lineWidth / 2, 0, Math.PI * 2);
          ctx.fill();
          return;
        }

        const nextMid = middle(last, p);

        ctx.beginPath();
        ctx.moveTo(midpoint.x, midpoint.y);
        ctx.quadraticCurveTo(
          last.x, last.y,
          nextMid.x, nextMid.y
        );
        ctx.stroke();

        last = p;
        midpoint = nextMid;
      }

      function finish() {
        if (last && midpoint) {
          ctx.beginPath();
          ctx.moveTo(midpoint.x, midpoint.y);
          ctx.lineTo(last.x, last.y);
          ctx.stroke();
        }

        drawing = false;
        pointerId = null;
        last = null;
        midpoint = null;
        strokes++;
        status.textContent = "Ready | Strokes: " + strokes;
      }

      canvas.addEventListener("pointerdown", e => {
        if (drawing) return;
        e.preventDefault();

        drawing = true;
        pointerId = e.pointerId;
        last = null;
        midpoint = null;

        try {
          canvas.setPointerCapture(e.pointerId);
        } catch (_) {}

        addPoint(point(e));
        status.textContent = "Drawing...";
      }, { passive: false });

      canvas.addEventListener("pointermove", e => {
        if (!drawing || e.pointerId !== pointerId) return;
        e.preventDefault();

        let events = [e];

        if (typeof e.getCoalescedEvents === "function") {
          try {
            const coalesced = e.getCoalescedEvents();
            if (coalesced.length) events = coalesced;
          } catch (_) {}
        }

        for (const sample of events) {
          addPoint(point(sample));
        }
      }, { passive: false });

      canvas.addEventListener("pointerup", e => {
        if (!drawing || e.pointerId !== pointerId) return;
        addPoint(point(e));
        finish();
      });

      canvas.addEventListener("pointercancel", () => {
        if (drawing) finish();
      });

      document.getElementById("clear").addEventListener("click", () => {
        if (drawing) return;

        const rect = canvas.getBoundingClientRect();
        ctx.fillStyle = "#fff";
        ctx.fillRect(0, 0, rect.width, rect.height);
        configure();

        strokes = 0;
        status.textContent = "Canvas cleared.";
      });

      window.addEventListener("resize", resize);
      resize();
    })();
  </script>
</body>
</html>
