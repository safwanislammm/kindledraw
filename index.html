
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Scribe Ink</title>

<style>
  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #fff;
    font-family: system-ui, sans-serif;
    touch-action: none;
    overscroll-behavior: none;
  }

  #toolbar {
    height: 42px;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 12px;
    border-bottom: 1px solid #ddd;
    background: #fafafa;
    color: #222;
    font-size: 12px;
  }

  #title {
    font-weight: 700;
    font-size: 14px;
  }

  #stats {
    margin-left: auto;
    white-space: nowrap;
    color: #555;
  }

  button {
    border: 1px solid #bbb;
    border-radius: 5px;
    padding: 5px 10px;
    background: white;
    color: #222;
    font-size: 12px;
    touch-action: manipulation;
  }

  #paper {
    display: block;
    width: 100%;
    height: calc(100% - 42px);
    background: white;
    touch-action: none;
  }
</style>
</head>

<body>
  <div id="toolbar">
    <span id="title">Scribe Ink</span>
    <button id="clear">Clear</button>
    <span id="stats">Waiting for pen…</span>
  </div>

  <canvas id="paper"></canvas>

<script>
(() => {
  const canvas = document.getElementById("paper");
  const ctx = canvas.getContext("2d", {
    alpha: false,
    desynchronized: true
  });

  const stats = document.getElementById("stats");
  const clearButton = document.getElementById("clear");

  let drawing = false;
  let activePointer = null;
  let lastX = 0;
  let lastY = 0;

  // Keep the backing canvas relatively small to reduce rendering work.
  // The CSS dimensions remain independent of this resolution.
  let scale = 1;

  let eventCount = 0;
  let sampleCount = 0;
  let windowStart = performance.now();

  function resizeCanvas() {
    const rect = canvas.getBoundingClientRect();

    // Preserve the existing drawing if the viewport changes.
    const oldCanvas = document.createElement("canvas");
    oldCanvas.width = canvas.width;
    oldCanvas.height = canvas.height;

    if (oldCanvas.width && oldCanvas.height) {
      oldCanvas.getContext("2d").drawImage(canvas, 0, 0);
    }

    // Lower backing resolution can reduce work on slower browsers.
    scale = Math.min(window.devicePixelRatio || 1, 1.5);

    canvas.width = Math.max(1, Math.round(rect.width * scale));
    canvas.height = Math.max(1, Math.round(rect.height * scale));

    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, rect.width, rect.height);

    if (oldCanvas.width && oldCanvas.height) {
      ctx.drawImage(
        oldCanvas,
        0, 0, oldCanvas.width, oldCanvas.height,
        0, 0, rect.width, rect.height
      );
    }

    ctx.strokeStyle = "#111111";
    ctx.fillStyle = "#111111";
    ctx.lineWidth = 2.5;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
  }

  function position(event) {
    const rect = canvas.getBoundingClientRect();

    return {
      x: event.clientX - rect.left,
      y: event.clientY - rect.top
    };
  }

  function getSamples(event) {
    // Browsers may combine many pen positions into one pointer event.
    // Use those original positions when available.
    if (typeof event.getCoalescedEvents === "function") {
      try {
        const samples = event.getCoalescedEvents();
        if (samples && samples.length > 0) {
          return samples;
        }
      } catch (_) {
        // Fall back to the ordinary pointer event.
      }
    }

    return [event];
  }

  function beginStroke(event) {
    if (event.pointerType === "mouse" && event.button !== 0) {
      return;
    }

    event.preventDefault();

    drawing = true;
    activePointer = event.pointerId;

    try {
      canvas.setPointerCapture(event.pointerId);
    } catch (_) {}

    const p = position(event);
    lastX = p.x;
    lastY = p.y;

    // Draw a dot immediately, even for a tap.
    ctx.beginPath();
    ctx.arc(lastX, lastY, ctx.lineWidth / 2, 0, Math.PI * 2);
    ctx.fill();

    eventCount++;
  }

  function moveStroke(event) {
    if (!drawing || event.pointerId !== activePointer) {
      return;
    }

    event.preventDefault();

    const samples = getSamples(event);

    eventCount++;
    sampleCount += samples.length;

    // Draw every available point in this event immediately.
    // No waiting for future points and no animation-frame queue.
    ctx.beginPath();
    ctx.moveTo(lastX, lastY);

    for (const sample of samples) {
      const p = position(sample);
      ctx.lineTo(p.x, p.y);
      lastX = p.x;
      lastY = p.y;
    }

    ctx.stroke();

    updateStats();
  }

  function endStroke(event) {
    if (event.pointerId !== activePointer) {
      return;
    }

    drawing = false;
    activePointer = null;
  }

  function updateStats() {
    const now = performance.now();
    const elapsed = now - windowStart;

    if (elapsed < 1000) {
      return;
    }

    const eventRate = eventCount * 1000 / elapsed;
    const sampleRate = sampleCount * 1000 / elapsed;

    stats.textContent =
      `Events ${eventRate.toFixed(1)}/s · Samples ${sampleRate.toFixed(0)}/s`;

    eventCount = 0;
    sampleCount = 0;
    windowStart = now;
  }

  canvas.addEventListener("pointerdown", beginStroke, {
    passive: false
  });

  canvas.addEventListener("pointermove", moveStroke, {
    passive: false
  });

  canvas.addEventListener("pointerup", endStroke);
  canvas.addEventListener("pointercancel", endStroke);
  canvas.addEventListener("lostpointercapture", () => {
    drawing = false;
    activePointer = null;
  });

  clearButton.addEventListener("click", () => {
    const rect = canvas.getBoundingClientRect();

    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, rect.width, rect.height);

    drawing = false;
    activePointer = null;
  });

  window.addEventListener("resize", resizeCanvas);

  resizeCanvas();
})();
</script>
</body>
</html>
